server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. A variable in proxy_pass makes nginx look up taskflow_api
    # per request, so a recreated api container (new IP) needs no web restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://taskflow_api:8000;
        # Strip /api before the request reaches FastAPI.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Vite puts hashed bundles here, so long caching is safe.
    location /assets/ {
        expires 30d;
        access_log off;
    }

    # index.html must never be cached, or users keep the old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /board, /metrics, /people, /login and hard reloads get index.html.
    location / {
        try_files $uri /index.html;
    }
}
