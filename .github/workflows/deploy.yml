name: Deploy TaskFlow to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: taskflow-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  deploy:
    needs: test
    # Self-hosted runner on the Qader staging server, registered with the label "taskflow".
    runs-on: [self-hosted, taskflow]
    steps:
      - uses: actions/checkout@v4

      - name: Build, start and health-check
        run: bash scripts/deploy.sh
