name: Deploy TaskFlow to staging

# Runs only on pushes to main and by hand. Do not add a pull_request trigger:
# this job runs on a self-hosted runner on the staging server.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: taskflow-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Self-hosted runner on the Qader staging server, registered with the label
    # "taskflow". Tests run inside a Docker build stage in deploy.sh, so this
    # workflow uses no GitHub-hosted minutes.
    runs-on: [self-hosted, taskflow]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test, back up, build, start and health-check
        run: bash scripts/deploy.sh
